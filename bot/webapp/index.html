<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Porabot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/miniapp/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Porabot</h1>
      <div
        id="profile-status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>
      <section aria-labelledby="scores-title">
        <h2 id="scores-title">Habit strength</h2>
        <p id="score-explanation"></p>
        <div id="scores"></div>
        <div
          id="scores-status"
          class="status"
          role="status"
          aria-live="polite"
        ></div>
      </section>
      <section aria-labelledby="heatmap-title">
        <h2 id="heatmap-title">Recorded activity</h2>
        <div id="view-controls">
          <button id="calendar-view" type="button">Calendar</button
          ><button id="list-view" type="button">List</button>
        </div>
        <div id="month-controls">
          <button id="month-prev" type="button">◀</button>
          <h3 id="month-label" aria-live="polite"></h3>
          <button id="month-next" type="button">▶</button>
        </div>
        <p id="heatmap-legend"></p>
        <div id="heatmap"></div>
        <p id="heatmap-detail" role="status" aria-live="polite"></p>
        <div
          id="heatmap-status"
          class="status"
          role="status"
          aria-live="polite"
        ></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/miniapp/app.js"></script>
  </body>
</html>
