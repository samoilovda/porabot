name: Deploy Porabot to VPS

on:
  push:
    branches:
      - main
  # Tests/lint/secret scan run on PRs too; the deploy job below is gated to
  # pushes on main only.
  pull_request:
    branches:
      - main

# A-30: two runs for the same ref must never deploy concurrently against
# the same VPS. Queue rather than cancel: cancelling an in-flight run could
# kill an SSH deploy halfway through `docker compose up --build`.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # A-01: scripts/scan_secrets.py's history scan needs full history, not the default shallow clone.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install "setuptools<81" wheel
          pip install -r requirements.lock
          pip install pytest pytest-asyncio ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Run tests
        env:
          BOT_TOKEN: "test-token"
        run: python -m pytest -q
      # A-01: catches a secret landing in the tree at HEAD (the shape of
      # leak that put a live BOT_TOKEN in README.md for ~4 months, see
      # docs/audits/2026-07-27-gpt-audit.md and
      # docs/audits/2026-09-22-audit.md#a-01). --no-history (current tree
      # only) is deliberate here — the full `--no-history`-less history
      # scan is for a one-off manual audit; gating every push on it would
      # keep failing CI forever over the already-leaked-and-rotated token
      # sitting in old commits, which nothing here can undo.
      - name: Scan for leaked secrets (current tree)
        run: python3 scripts/scan_secrets.py --no-history

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # A-30: pinned by commit SHA (tag v1.0.3), not a mutable tag — a
        # compromised/re-pushed tag on this third-party action would
        # otherwise run arbitrary code with SSH access to the VPS.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Step 6 (2026-09-26 audit remediation): script_stop makes the
          # action itself fail the step (and this job) the moment any
          # command below returns non-zero — previously nothing here
          # stopped on error, so a failed `git pull`, a failed backup, or
          # `docker compose up` refusing to start still reported success.
          script_stop: true
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail

            # 1. Fetch and check out the EXACT commit this workflow run
            # tested — never `git pull`, which resolves to whatever main
            # points to AT DEPLOY TIME and can silently pick up a second
            # push that landed after this run's own checkout, deploying
            # code this run never actually tested.
            cd "${{ secrets.PROJECT_PATH }}"
            PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"

            # 2. Back up both SQLite databases before restarting the
            # container on new code, and verify the backup actually
            # restores. Both now BLOCK the deploy on failure (previously
            # best-effort/no-op on a missing script) — a bad or unverified
            # backup right before a restart is worse than not deploying.
            cd "${{ secrets.ORCHESTRATOR_PATH }}"
            "${{ secrets.PROJECT_PATH }}/scripts/backup.sh" ./data ./backups 14
            "${{ secrets.PROJECT_PATH }}/scripts/verify_backup.sh" ./backups

            # 3. Restart the containers on the new code.
            docker compose up -d --build

            # 4. Wait for docker-compose.yml's own healthcheck (heartbeat
            # file — see its comment there) to report healthy; roll back
            # to the previous commit and restart on new code otherwise, so
            # a bad deploy doesn't sit broken until someone notices.
            rollback() {
              echo "Health check failed — rolling back to $PREV_SHA" >&2
              cd "${{ secrets.PROJECT_PATH }}"
              git checkout --detach "$PREV_SHA"
              cd "${{ secrets.ORCHESTRATOR_PATH }}"
              docker compose up -d --build
              exit 1
            }

            healthy=0
            for _ in $(seq 1 30); do
              status="$(docker inspect --format='{{.State.Health.Status}}' porabot 2>/dev/null || echo "starting")"
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 10
            done
            [ "$healthy" -eq 1 ] || rollback

            echo "Deploy of $DEPLOY_SHA succeeded and is healthy."
        env:
          DEPLOY_SHA: ${{ github.sha }}
